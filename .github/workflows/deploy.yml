name: Deploy to Arenhost Shared Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4


      - name: 🚀 Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # Opsional jika private key memiliki passphrase
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Masuk ke direktori project di shared hosting
            cd ${{ secrets.SSH_PROJECT_PATH }} || exit 1

            # Tarik kode terbaru dari GitHub
            git pull origin main

            # Update file .env production secara otomatis jika diset di GitHub Secret
            if [ -n "${{ secrets.ENV_PRODUCTION }}" ]; then
              echo "${{ secrets.ENV_PRODUCTION }}" > .env
              echo "✅ .env production berhasil diupdate dari GitHub Secrets!"
            fi

            # A missing/empty APP_KEY makes every request fail with
            # "No application encryption key has been specified" and the
            # config:cache below would bake the empty value into cache.
            # Regenerate the key before caching whenever it is absent.
            if ! grep -q '^APP_KEY=base64:' .env; then
              php artisan key:generate --force
              echo "✅ APP_KEY not found in .env, regenerated."
            fi

            # Install vendor dependencies jika ada update package
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --ignore-platform-reqs

            # Jalankan migrasi database
            php artisan migrate --force

            # Bersihkan dan buat cache baru untuk kecepatan maksimal
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Pastikan storage link tetap aktif
            php artisan storage:link || true

            echo "✅ Deployment ke Arenhost Berhasil Selesai!"
